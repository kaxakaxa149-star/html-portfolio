<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Contact Me</title>
    </head>
    <body>
        <h1>Contact me</h1>
        <p>Email: kaxa@gmail.com</p>
        <form>
            <h2>Send me a message</h2>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>
            <label for="email">email</label>
            <input id="email" name="email" type="email" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" required maxlength="200" placeholder="Write your message..."></textarea>
            <h3>Preferred contact method</h3>
            <label for="phone">Phone</label>
            <input type="radio" id="phone" value="phone" name="contact method">
            <label for="contact-email">Email</label>
            <input type="radio" id="contact-email" value="email" name="contact method">
            <button type="submit">Send Message</button>
        </form>
        <a href="./index.html">Main Page</a>
        <a href="./hobbies.html">Hobbies</a>
    </body>
</html>
